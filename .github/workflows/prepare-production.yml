name: Prepare production (Stage 2)

on:
  workflow_dispatch:
    inputs:
      expected_commit_sha:
        description: "Reviewed full 40-character commit SHA"
        required: true
        type: string
      confirmation:
        description: "Type PREPARE to build images and publish a verified production snapshot"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  validate:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Validate reviewed commit SHA
        env:
          EXPECTED_COMMIT_SHA: ${{ github.event.inputs.expected_commit_sha }}
          ACTUAL_COMMIT_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$EXPECTED_COMMIT_SHA" =~ ^[0-9a-fA-F]{40}$ ]] || {
            echo "Expected commit SHA must be a full 40-character hexadecimal SHA."
            exit 1
          }
          normalized_expected="$(printf '%s' "$EXPECTED_COMMIT_SHA" | tr '[:upper:]' '[:lower:]')"
          normalized_actual="$(printf '%s' "$ACTUAL_COMMIT_SHA" | tr '[:upper:]' '[:lower:]')"
          if [ "$normalized_expected" != "$normalized_actual" ]; then
            echo "Expected commit SHA does not match the dispatched workflow SHA."
            echo "Expected commit SHA: $normalized_expected"
            echo "Actual workflow SHA: $normalized_actual"
            exit 1
          fi

      - name: Require an explicit Stage 2 request
        env:
          PREPARE_CONFIRMATION: ${{ inputs.confirmation }}
        shell: bash
        run: |
          set -euo pipefail
          [ "$PREPARE_CONFIRMATION" = "PREPARE" ] || { echo "Production Stage 2 was not confirmed"; exit 1; }

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Verify Frontend
        working-directory: frontend
        run: |
          npm ci
          npm run lint
          npm test
          npm run build

      - name: Verify Backend and Importers
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail
          unformatted="$(gofmt -l .)"
          [ -z "$unformatted" ] || { echo "Go files require gofmt:"; printf '%s\n' "$unformatted"; exit 1; }
          go vet ./...
          go test ./...

      - name: Verify production workflow guards
        run: scripts/production/check-workflow-guards.sh

  prepare:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write
    environment:
      name: production
    env:
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_FEDERATED_SUBJECT: ${{ vars.AZURE_FEDERATED_SUBJECT }}
      AZURE_CONTAINER_REGISTRY: ${{ vars.AZURE_CONTAINER_REGISTRY }}
      ACR_LOGIN_SERVER: ${{ vars.ACR_LOGIN_SERVER }}
      NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
      PRODUCTION_SNAPSHOT_UPLOAD: ${{ vars.PRODUCTION_SNAPSHOT_UPLOAD || 'false' }}
      AZURE_STORAGE_ACCOUNT_NAME: ${{ vars.AZURE_STORAGE_ACCOUNT_NAME }}
      AZURE_STORAGE_CONTAINER_NAME: ${{ vars.AZURE_STORAGE_CONTAINER_NAME }}
      AZURE_STORAGE_CURRENT_BLOB: ${{ vars.AZURE_STORAGE_CURRENT_BLOB || 'current.json' }}

    steps:
      - uses: actions/checkout@v4

      - name: Fail closed unless Stage 2 prerequisites are explicit
        env:
          ESTAT_APP_ID: ${{ secrets.ESTAT_APP_ID }}
        shell: bash
        run: |
          set -euo pipefail
          required=(AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID AZURE_FEDERATED_SUBJECT AZURE_CONTAINER_REGISTRY ACR_LOGIN_SERVER NEXT_PUBLIC_SITE_URL ESTAT_APP_ID AZURE_STORAGE_ACCOUNT_NAME AZURE_STORAGE_CONTAINER_NAME AZURE_STORAGE_CURRENT_BLOB)
          for name in "${required[@]}"; do
            [ -n "${!name:-}" ] || { echo "Required production setting is missing: $name"; exit 1; }
          done
          scripts/production/validate-public-site-url.py >/dev/null
          [[ "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "GITHUB_SHA must be a full commit SHA"; exit 1; }
          scripts/production/validate-acr-login-server.sh >/dev/null
          [ "$PRODUCTION_SNAPSHOT_UPLOAD" = "true" ] || {
            echo "PRODUCTION_SNAPSHOT_UPLOAD must be true for production Stage 2"
            exit 1
          }
          echo "Stage 2 target commit: $GITHUB_SHA"

      - name: Build linux/amd64 application images
        shell: bash
        run: |
          set -euo pipefail
          docker buildx build --platform linux/amd64 --load \
            --build-arg NEXT_PUBLIC_SITE_URL="$NEXT_PUBLIC_SITE_URL" \
            -t "kokusei-frontend:$GITHUB_SHA" frontend
          docker buildx build --platform linux/amd64 --load \
            -t "kokusei-backend:$GITHUB_SHA" backend

      - name: Verify GitHub OIDC claims
        env:
          EXPECTED_OIDC_SUBJECT: ${{ env.AZURE_FEDERATED_SUBJECT }}
          EXPECTED_WORKFLOW_PATH: .github/workflows/prepare-production.yml
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --fail --silent --show-error \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=api%3A%2F%2FAzureADTokenExchange")"
          token="$(printf '%s' "$response" | jq -er '.value')"
          OIDC_TOKEN="$token" scripts/production/verify-github-oidc-claims.py
          unset token response

      - name: Authenticate to Azure with verified OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Refuse to overwrite an existing commit SHA tag
        shell: bash
        run: |
          set -euo pipefail
          for repository in frontend backend; do
            repository_exists="$(az acr repository list \
              --name "$AZURE_CONTAINER_REGISTRY" \
              --query "contains(@, '$repository')" -o tsv)"
            if [ "$repository_exists" = "true" ]; then
              tag_count="$(az acr repository show-tags \
                --name "$AZURE_CONTAINER_REGISTRY" \
                --repository "$repository" \
                --query "[?@=='$GITHUB_SHA'] | length(@)" -o tsv)"
              [ "$tag_count" = "0" ] || {
                echo "Refusing to overwrite existing ACR tag: $repository:$GITHUB_SHA"
                exit 1
              }
            fi
          done

      - name: Push application images with the full commit SHA
        shell: bash
        run: |
          set -euo pipefail
          az acr login --name "$AZURE_CONTAINER_REGISTRY"
          registry="$(scripts/production/validate-acr-login-server.sh)"
          frontend_image="$registry/frontend:$GITHUB_SHA"
          backend_image="$registry/backend:$GITHUB_SHA"
          docker tag "kokusei-frontend:$GITHUB_SHA" "$frontend_image"
          docker tag "kokusei-backend:$GITHUB_SHA" "$backend_image"
          docker push "$frontend_image"
          docker push "$backend_image"
          {
            echo "REGISTRY=$registry"
            echo "FRONTEND_IMAGE=$frontend_image"
            echo "BACKEND_IMAGE=$backend_image"
          } >> "$GITHUB_ENV"

      - name: Resolve digests and verify linux/amd64 manifests
        shell: bash
        run: |
          set -euo pipefail

          frontend_digest="$(az acr manifest show-metadata \
            --registry "$AZURE_CONTAINER_REGISTRY" \
            --name "frontend:$GITHUB_SHA" \
            --query digest -o tsv)"
          backend_digest="$(az acr manifest show-metadata \
            --registry "$AZURE_CONTAINER_REGISTRY" \
            --name "backend:$GITHUB_SHA" \
            --query digest -o tsv)"

          [[ "$frontend_digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "Frontend digest is invalid"; exit 1; }
          [[ "$backend_digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "Backend digest is invalid"; exit 1; }

          frontend_platform="$(scripts/production/verify-image-platform.sh "$FRONTEND_IMAGE")"
          backend_platform="$(scripts/production/verify-image-platform.sh "$BACKEND_IMAGE")"
          [ "$frontend_platform" = "linux/amd64" ] || { echo "Frontend manifest must be linux/amd64"; exit 1; }
          [ "$backend_platform" = "linux/amd64" ] || { echo "Backend manifest must be linux/amd64"; exit 1; }

          {
            echo "FRONTEND_DIGEST=$frontend_digest"
            echo "BACKEND_DIGEST=$backend_digest"
            echo "FRONTEND_ARCH=amd64"
            echo "FRONTEND_OS=linux"
            echo "BACKEND_ARCH=amd64"
            echo "BACKEND_OS=linux"
          } >> "$GITHUB_ENV"

      - name: Download and verify the currently published Blob snapshot
        shell: bash
        run: scripts/production/download-current-blob-snapshot.sh

      - name: Generate and validate the official JSON snapshot
        env:
          ESTAT_APP_ID: ${{ secrets.ESTAT_APP_ID }}
        shell: bash
        run: |
          set -euo pipefail
          snapshot_directory="$(mktemp -d "$RUNNER_TEMP/kokusei-snapshot.XXXXXX")"
          chmod 0700 "$snapshot_directory"
          snapshot="$snapshot_directory/dataset.json"
          if [ "$PREVIOUS_SNAPSHOT_PRESENT" = "true" ]; then
            docker run --rm \
              --user "$(id -u):$(id -g)" \
              --entrypoint /export-snapshot \
              --env ESTAT_APP_ID \
              --volume "$snapshot_directory:/snapshot" \
              --volume "$PREVIOUS_SNAPSHOT_DIRECTORY:/previous:ro" \
              "kokusei-backend:$GITHUB_SHA" \
              --output /snapshot/dataset.json \
              --previous /previous/dataset.json \
              --commit-sha "$GITHUB_SHA"
          else
            docker run --rm \
              --user "$(id -u):$(id -g)" \
              --entrypoint /export-snapshot \
              --env ESTAT_APP_ID \
              --volume "$snapshot_directory:/snapshot" \
              "kokusei-backend:$GITHUB_SHA" \
              --output /snapshot/dataset.json \
              --commit-sha "$GITHUB_SHA"
          fi
          chmod 0600 "$snapshot"
          jq -e '
            .schemaVersion == 1
            and .sourceCommitSha == env.GITHUB_SHA
            and (.indicators | length == 3)
            and ([.indicators[].slug] | sort == ["births", "population", "unemployment-rate"])
            and all(.indicators[];
              (.series | length) > 0
              and (.latest.value | type == "string")
              and (.sourceUrl | startswith("https://"))
              and all(.series[]; (.value | type == "string") and (.sourceUrl | startswith("https://")))
            )
            and (.updates | type == "array")
            and all(.updates[];
              (.id | type == "number" and . > 0)
              and (.currentValue | type == "string")
              and (.sourceUrl | startswith("https://"))
              and (.developmentData == false)
            )
          ' "$snapshot" >/dev/null
          echo "SNAPSHOT_DATASET=$snapshot" >> "$GITHUB_ENV"
          echo "SNAPSHOT_DIRECTORY=$snapshot_directory" >> "$GITHUB_ENV"

      - name: Upload and read back the immutable Blob snapshot
        shell: bash
        run: scripts/production/upload-blob-snapshot.sh

      - name: Write safe Stage 2 metadata
        shell: bash
        run: |
          set -euo pipefail
          metadata="$RUNNER_TEMP/production-stage2-metadata.json"
          jq -n \
            --arg commit "$GITHUB_SHA" \
            --arg frontend_image "$FRONTEND_IMAGE" \
            --arg frontend_digest "$FRONTEND_DIGEST" \
            --arg frontend_arch "$FRONTEND_ARCH" \
            --arg frontend_os "$FRONTEND_OS" \
            --arg backend_image "$BACKEND_IMAGE" \
            --arg backend_digest "$BACKEND_DIGEST" \
            --arg backend_arch "$BACKEND_ARCH" \
            --arg backend_os "$BACKEND_OS" \
            --arg snapshot_enabled "$PRODUCTION_SNAPSHOT_UPLOAD" \
            --arg storage_account "${AZURE_STORAGE_ACCOUNT_NAME:-}" \
            --arg container "${AZURE_STORAGE_CONTAINER_NAME:-}" \
            --arg current_blob "${SNAPSHOT_CURRENT_BLOB:-}" \
            --arg snapshot_blob "${SNAPSHOT_BLOB:-}" \
            --arg dataset_sha256 "${SNAPSHOT_SHA256:-}" \
            --arg dataset_size "${SNAPSHOT_SIZE:-0}" \
            --arg schema_version "${SNAPSHOT_SCHEMA_VERSION:-0}" \
            --arg generated_at "${SNAPSHOT_GENERATED_AT:-}" \
            --arg source_commit "$GITHUB_SHA" \
            --arg upload_succeeded "${SNAPSHOT_UPLOAD_SUCCEEDED:-false}" \
            --arg read_back_succeeded "${SNAPSHOT_READ_BACK_SUCCEEDED:-false}" \
            '{
              commit_sha: $commit,
              frontend: {image_uri: $frontend_image, digest: $frontend_digest, architecture: $frontend_arch, os: $frontend_os},
              backend: {image_uri: $backend_image, digest: $backend_digest, architecture: $backend_arch, os: $backend_os},
              snapshot_generation: "succeeded",
              official_data_fetch: {births: "succeeded", unemployment_rate: "succeeded", population: "succeeded"},
              validation: {births: "succeeded", unemployment_rate: "succeeded", population: "succeeded", all: "succeeded"},
              blob_snapshot: {
                enabled: ($snapshot_enabled == "true"),
                storageAccountName: $storage_account,
                containerName: $container,
                currentBlobName: $current_blob,
                snapshotBlobName: $snapshot_blob,
                datasetSha256: $dataset_sha256,
                datasetSize: ($dataset_size | tonumber),
                schemaVersion: ($schema_version | tonumber),
                generatedAt: $generated_at,
                sourceCommitSha: $source_commit,
                uploadSucceeded: ($upload_succeeded == "true"),
                readBackSucceeded: ($read_back_succeeded == "true")
              }
            }' > "$metadata"
          chmod 0600 "$metadata"
          echo "STAGE2_METADATA=$metadata" >> "$GITHUB_ENV"

          {
            echo "## Production Stage 2 completed"
            echo
            echo "- Commit SHA: \`$GITHUB_SHA\`"
            echo "- Frontend image: \`$FRONTEND_IMAGE\`"
            echo "- Frontend digest: \`$FRONTEND_DIGEST\`"
            echo "- Frontend platform: \`$FRONTEND_OS/$FRONTEND_ARCH\`"
            echo "- Backend image: \`$BACKEND_IMAGE\`"
            echo "- Backend digest: \`$BACKEND_DIGEST\`"
            echo "- Backend platform: \`$BACKEND_OS/$BACKEND_ARCH\`"
            echo "- Snapshot generation: succeeded"
            echo "- Official data fetch: births, unemployment-rate, and population succeeded"
            echo "- Validation: snapshot schema, indicators, sources, and revision history succeeded"
            echo "- Blob snapshot upload enabled: \`$PRODUCTION_SNAPSHOT_UPLOAD\`"
            echo
            echo "Stage 3 was not started. Review these immutable digests before manually dispatching Stage 3."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Stage 2 metadata
        uses: actions/upload-artifact@v4
        with:
          name: production-stage2-${{ github.sha }}
          path: ${{ env.STAGE2_METADATA }}
          if-no-files-found: error
          retention-days: 30

      - name: Remove temporary snapshot files
        if: always()
        shell: bash
        run: |
          set -eu
          [ -z "${SNAPSHOT_DIRECTORY:-}" ] || rm -rf "$SNAPSHOT_DIRECTORY"
          [ -z "${PREVIOUS_SNAPSHOT_DIRECTORY:-}" ] || rm -rf "$PREVIOUS_SNAPSHOT_DIRECTORY"
