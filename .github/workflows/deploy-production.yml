name: Publish production (Stage 3)

on:
  workflow_dispatch:
    inputs:
      stage2_run_id:
        description: "Successful Production Stage 2 run ID that produced the reviewed artifact"
        required: true
        type: string
      commit_sha:
        description: "Full commit SHA completed by Production Stage 2"
        required: true
        type: string
      frontend_image_digest:
        description: "Frontend sha256 digest reported by Production Stage 2"
        required: true
        type: string
      backend_image_digest:
        description: "Backend sha256 digest reported by Production Stage 2"
        required: true
        type: string
      confirmation:
        description: "Type PUBLISH to create or update the production Container Apps"
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  validate:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      STAGE2_RUN_ID: ${{ inputs.stage2_run_id }}
      TARGET_COMMIT: ${{ inputs.commit_sha }}
      FRONTEND_DIGEST: ${{ inputs.frontend_image_digest }}
      BACKEND_DIGEST: ${{ inputs.backend_image_digest }}
      PUBLISH_CONFIRMATION: ${{ inputs.confirmation }}
      ACTUAL_COMMIT_SHA: ${{ github.sha }}
    steps:
      - name: Require explicit immutable Stage 3 inputs
        shell: bash
        run: |
          set -euo pipefail
          [ "$PUBLISH_CONFIRMATION" = "PUBLISH" ] || { echo "Production Stage 3 was not confirmed"; exit 1; }
          [[ "$STAGE2_RUN_ID" =~ ^[1-9][0-9]*$ ]] || { echo "stage2_run_id must be a positive integer"; exit 1; }
          [[ "$TARGET_COMMIT" =~ ^[0-9a-f]{40}$ ]] || { echo "commit_sha must be a full Git commit SHA"; exit 1; }
          [[ "$FRONTEND_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "frontend_image_digest must be a sha256 digest"; exit 1; }
          [[ "$BACKEND_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "backend_image_digest must be a sha256 digest"; exit 1; }
          [ "$TARGET_COMMIT" = "$ACTUAL_COMMIT_SHA" ] || {
            echo "commit_sha must exactly match the dispatched Stage 3 workflow SHA"
            exit 1
          }

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require the target commit to be the reviewed main HEAD
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "${TARGET_COMMIT}^{commit}"
          [ "$(git rev-parse HEAD)" = "$TARGET_COMMIT" ] || {
            echo "The checked out Stage 3 workflow SHA does not match commit_sha"
            exit 1
          }

      - name: Verify production workflow guards
        run: scripts/production/check-workflow-guards.sh

      - name: Bind Stage 3 inputs to the exact successful Stage 2 artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          temporary_directory="$(mktemp -d "$RUNNER_TEMP/kokusei-stage2-evidence.XXXXXX")"
          cleanup() {
            rm -rf "$temporary_directory"
          }
          trap cleanup EXIT HUP INT TERM
          chmod 0700 "$temporary_directory"

          run_json="$temporary_directory/run.json"
          artifacts_json="$temporary_directory/artifacts.json"
          artifact_zip="$temporary_directory/artifact.zip"
          metadata_json="$temporary_directory/production-stage2-metadata.json"

          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$STAGE2_RUN_ID" > "$run_json"
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$STAGE2_RUN_ID/artifacts?per_page=100" > "$artifacts_json"
          chmod 0600 "$run_json" "$artifacts_json"

          artifact_id="$(
            scripts/production/validate-stage2-evidence.py \
              select-artifact "$run_json" "$artifacts_json"
          )"
          [[ "$artifact_id" =~ ^[1-9][0-9]*$ ]] || {
            echo "Validated Stage 2 artifact ID is invalid"
            exit 1
          }

          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" > "$artifact_zip"
          chmod 0600 "$artifact_zip"
          [ "$(zipinfo -1 "$artifact_zip")" = "production-stage2-metadata.json" ] || {
            echo "Stage 2 artifact must contain only production-stage2-metadata.json"
            exit 1
          }
          unzip -qq "$artifact_zip" -d "$temporary_directory"
          chmod 0600 "$metadata_json"
          scripts/production/validate-stage2-evidence.py \
            validate-metadata "$metadata_json"

  publish:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    environment:
      name: production
      url: ${{ vars.NEXT_PUBLIC_SITE_URL }}
    env:
      STAGE2_RUN_ID: ${{ inputs.stage2_run_id }}
      TARGET_COMMIT: ${{ inputs.commit_sha }}
      FRONTEND_DIGEST: ${{ inputs.frontend_image_digest }}
      BACKEND_DIGEST: ${{ inputs.backend_image_digest }}
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_FEDERATED_SUBJECT: ${{ vars.AZURE_FEDERATED_SUBJECT }}
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      AZURE_CONTAINER_REGISTRY: ${{ vars.AZURE_CONTAINER_REGISTRY }}
      ACR_LOGIN_SERVER: ${{ vars.ACR_LOGIN_SERVER }}
      AZURE_CONTAINER_APP_ENVIRONMENT: ${{ vars.AZURE_CONTAINER_APP_ENVIRONMENT }}
      AZURE_CONTAINER_APP_FRONTEND: ${{ vars.AZURE_CONTAINER_APP_FRONTEND }}
      AZURE_CONTAINER_APP_BACKEND: ${{ vars.AZURE_CONTAINER_APP_BACKEND }}
      FRONTEND_IDENTITY_ID: ${{ vars.FRONTEND_IDENTITY_ID }}
      BACKEND_IDENTITY_ID: ${{ vars.BACKEND_IDENTITY_ID }}
      BACKEND_IDENTITY_CLIENT_ID: ${{ vars.BACKEND_IDENTITY_CLIENT_ID }}
      NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
      PRODUCTION_DATA_STORE: ${{ vars.PRODUCTION_DATA_STORE || 'blob' }}
      AZURE_STORAGE_ACCOUNT_NAME: ${{ vars.AZURE_STORAGE_ACCOUNT_NAME }}
      AZURE_STORAGE_CONTAINER_NAME: ${{ vars.AZURE_STORAGE_CONTAINER_NAME }}
      AZURE_STORAGE_CURRENT_BLOB: ${{ vars.AZURE_STORAGE_CURRENT_BLOB || 'current.json' }}

    steps:
      - uses: actions/checkout@v4

      - name: Fail closed unless Stage 3 prerequisites are explicit
        shell: bash
        run: |
          set -euo pipefail
          required=(TARGET_COMMIT FRONTEND_DIGEST BACKEND_DIGEST AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID AZURE_FEDERATED_SUBJECT AZURE_RESOURCE_GROUP AZURE_CONTAINER_REGISTRY ACR_LOGIN_SERVER AZURE_CONTAINER_APP_ENVIRONMENT AZURE_CONTAINER_APP_FRONTEND AZURE_CONTAINER_APP_BACKEND FRONTEND_IDENTITY_ID BACKEND_IDENTITY_ID BACKEND_IDENTITY_CLIENT_ID NEXT_PUBLIC_SITE_URL PRODUCTION_DATA_STORE AZURE_STORAGE_ACCOUNT_NAME AZURE_STORAGE_CONTAINER_NAME AZURE_STORAGE_CURRENT_BLOB)
          for name in "${required[@]}"; do
            [ -n "${!name:-}" ] || { echo "Required production setting is missing: $name"; exit 1; }
          done
          scripts/production/validate-public-site-url.py >/dev/null
          scripts/production/validate-acr-login-server.sh >/dev/null
          [ "$PRODUCTION_DATA_STORE" = "blob" ] || {
            echo "PRODUCTION_DATA_STORE must be blob for production Stage 3"
            exit 1
          }

      - name: Verify GitHub OIDC claims
        env:
          EXPECTED_OIDC_SUBJECT: ${{ env.AZURE_FEDERATED_SUBJECT }}
          EXPECTED_WORKFLOW_PATH: .github/workflows/deploy-production.yml
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --fail --silent --show-error \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=api%3A%2F%2FAzureADTokenExchange")"
          token="$(printf '%s' "$response" | jq -er '.value')"
          OIDC_TOKEN="$token" scripts/production/verify-github-oidc-claims.py
          unset token response

      - name: Authenticate to Azure with verified OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Mark the verified Azure session
        shell: bash
        run: echo "AZURE_AUTHENTICATED=true" >> "$GITHUB_ENV"

      - name: Verify Stage 2 digests and linux/amd64 manifests
        shell: bash
        run: |
          set -euo pipefail
          az acr login --name "$AZURE_CONTAINER_REGISTRY"
          registry="$(scripts/production/validate-acr-login-server.sh)"

          verify_image() {
            repository=$1
            digest=$2
            image_ref="$registry/$repository@$digest"
            metadata="$(az acr manifest show-metadata \
              --registry "$AZURE_CONTAINER_REGISTRY" \
              --name "$repository@$digest" -o json)"
            actual_digest="$(jq -er '.digest' <<<"$metadata")"
            [ "$actual_digest" = "$digest" ] || { echo "$repository digest does not match ACR"; exit 1; }
            jq -e --arg sha "$TARGET_COMMIT" '.tags | index($sha) != null' <<<"$metadata" >/dev/null || {
              echo "$repository digest is not tagged with the requested commit SHA"
              exit 1
            }

            platform="$(scripts/production/verify-image-platform.sh "$image_ref")"
            unset metadata
            [ "$platform" = "linux/amd64" ] || {
              echo "$repository image must be linux/amd64"
              exit 1
            }
          }

          verify_image frontend "$FRONTEND_DIGEST"
          verify_image backend "$BACKEND_DIGEST"

          {
            echo "REGISTRY=$registry"
            echo "FRONTEND_IMAGE=$registry/frontend@$FRONTEND_DIGEST"
            echo "BACKEND_IMAGE=$registry/backend@$BACKEND_DIGEST"
            echo "REVISION_SUFFIX=sha-${TARGET_COMMIT:0:8}-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          } >> "$GITHUB_ENV"

      - name: Verify Frontend platform FQDN and public custom domain before deployment
        shell: bash
        run: |
          set -euo pipefail
          site_url="$(scripts/production/validate-public-site-url.py)"
          public_site_host="${site_url#https://}"
          environment_domain="$(az containerapp env show \
            -g "$AZURE_RESOURCE_GROUP" \
            -n "$AZURE_CONTAINER_APP_ENVIRONMENT" \
            --query properties.defaultDomain -o tsv)"
          platform_fqdn="$AZURE_CONTAINER_APP_FRONTEND.$environment_domain"

          if frontend_json="$(az containerapp show \
            -g "$AZURE_RESOURCE_GROUP" \
            -n "$AZURE_CONTAINER_APP_FRONTEND" \
            --output json 2>/dev/null)"; then
            actual_fqdn="$(jq -er '.properties.configuration.ingress.fqdn' <<<"$frontend_json")"
            [ "$actual_fqdn" = "$platform_fqdn" ] || {
              echo "Frontend platform FQDN does not match the Container Apps environment"
              exit 1
            }
            if [ "$public_site_host" != "$platform_fqdn" ]; then
              certificate_id="$(jq -er --arg host "$public_site_host" '
                [
                  .properties.configuration.ingress.customDomains[]?
                  | select(
                      .name == $host
                      and .bindingType == "SniEnabled"
                      and (.certificateId | type == "string" and length > 0)
                    )
                  | .certificateId
                ]
                | if length == 1 then .[0] else error("public custom domain binding is missing or ambiguous") end
              ' <<<"$frontend_json")"
              certificate_json="$(az resource show \
                --ids "$certificate_id" \
                --api-version 2025-01-01 \
                --output json)"
              jq -e --arg host "$public_site_host" '
                .properties.subjectName == $host
                and .properties.provisioningState == "Succeeded"
              ' <<<"$certificate_json" >/dev/null || {
                echo "Frontend managed certificate is not ready for the public custom domain"
                exit 1
              }
            fi
          elif [ "$public_site_host" != "$platform_fqdn" ]; then
            echo "Frontend must exist with a secured custom domain before using a custom NEXT_PUBLIC_SITE_URL"
            exit 1
          fi

          {
            echo "PUBLIC_SITE_URL=$site_url"
            echo "PUBLIC_SITE_HOST=$public_site_host"
            echo "FRONTEND_PLATFORM_FQDN=$platform_fqdn"
          } >> "$GITHUB_ENV"
          unset frontend_json certificate_json certificate_id

      - name: Create or update internal Backend
        shell: bash
        run: |
          set -euo pipefail
          temporary_directory="$(mktemp -d "$RUNNER_TEMP/kokusei-stage3-backend.XXXXXX")"
          cleanup() {
            rm -rf "$temporary_directory"
          }
          trap cleanup EXIT HUP INT TERM

          environment_id="$(az containerapp env show -g "$AZURE_RESOURCE_GROUP" -n "$AZURE_CONTAINER_APP_ENVIRONMENT" --query id -o tsv)"
          specification="$temporary_directory/backend-container-app.json"
          jq -n \
            --arg environment_id "$environment_id" \
            --arg identity_id "$BACKEND_IDENTITY_ID" \
            --arg registry "$REGISTRY" \
            --arg image "$BACKEND_IMAGE" \
            --arg revision "$REVISION_SUFFIX" \
            --arg data_store "$PRODUCTION_DATA_STORE" \
            --arg storage_account "$AZURE_STORAGE_ACCOUNT_NAME" \
            --arg storage_container "$AZURE_STORAGE_CONTAINER_NAME" \
            --arg current_blob "$AZURE_STORAGE_CURRENT_BLOB" \
            --arg backend_client_id "$BACKEND_IDENTITY_CLIENT_ID" \
            '{
              identity: {type: "UserAssigned", userAssignedIdentities: {($identity_id): {}}},
              properties: {
                environmentId: $environment_id,
                configuration: {
                  activeRevisionsMode: "Multiple",
                  ingress: {external: false, targetPort: 8080, transport: "auto", allowInsecure: false},
                  registries: [{server: $registry, identity: $identity_id}],
                  secrets: []
                },
                template: {
                  revisionSuffix: $revision,
                  containers: [{
                    name: "backend",
                    image: $image,
                    resources: {cpu: 0.25, memory: "0.5Gi"},
                    env: [
                      {name: "DATA_STORE", value: $data_store},
                      {name: "PORT", value: "8080"},
                      {name: "AZURE_STORAGE_ACCOUNT_NAME", value: $storage_account},
                      {name: "AZURE_STORAGE_CONTAINER_NAME", value: $storage_container},
                      {name: "AZURE_STORAGE_CURRENT_BLOB", value: $current_blob},
                      {name: "AZURE_CLIENT_ID", value: $backend_client_id}
                    ],
                    probes: [
                      {type: "Startup", httpGet: {path: "/health", port: 8080}, initialDelaySeconds: 5, periodSeconds: 5, failureThreshold: 10},
                      {type: "Liveness", httpGet: {path: "/health", port: 8080}, initialDelaySeconds: 10, periodSeconds: 10, failureThreshold: 3},
                      {type: "Readiness", httpGet: {path: "/health", port: 8080}, initialDelaySeconds: 5, periodSeconds: 5, failureThreshold: 3}
                    ]
                  }],
                  scale: {minReplicas: 0, maxReplicas: 2}
                }
              }
            }' > "$specification"
          chmod 0600 "$specification"

          # /health is intentionally process-only; API smoke tests verify Blob snapshot access.
          if az containerapp show -g "$AZURE_RESOURCE_GROUP" -n "$AZURE_CONTAINER_APP_BACKEND" --output none 2>/dev/null; then
            az containerapp update -g "$AZURE_RESOURCE_GROUP" -n "$AZURE_CONTAINER_APP_BACKEND" \
              --yaml "$specification" --only-show-errors --output none
          else
            az containerapp create -g "$AZURE_RESOURCE_GROUP" -n "$AZURE_CONTAINER_APP_BACKEND" \
              --environment "$AZURE_CONTAINER_APP_ENVIRONMENT" \
              --yaml "$specification" --only-show-errors --output none
          fi

          backend_fqdn="$(az containerapp show -g "$AZURE_RESOURCE_GROUP" -n "$AZURE_CONTAINER_APP_BACKEND" --query properties.configuration.ingress.fqdn -o tsv)"
          backend_revision="$(az containerapp show -g "$AZURE_RESOURCE_GROUP" -n "$AZURE_CONTAINER_APP_BACKEND" --query properties.latestRevisionName -o tsv)"
          [ -n "$backend_revision" ] || { echo "Backend active revision is missing"; exit 1; }
          az containerapp ingress traffic set \
            -g "$AZURE_RESOURCE_GROUP" \
            -n "$AZURE_CONTAINER_APP_BACKEND" \
            --revision-weight "$backend_revision=100" \
            --only-show-errors --output none

          backend_app_json="$temporary_directory/backend-app.json"
          backend_revision_json="$temporary_directory/backend-revision.json"
          az containerapp show \
            -g "$AZURE_RESOURCE_GROUP" \
            -n "$AZURE_CONTAINER_APP_BACKEND" \
            --output json > "$backend_app_json"
          az containerapp revision show \
            -g "$AZURE_RESOURCE_GROUP" \
            -n "$AZURE_CONTAINER_APP_BACKEND" \
            --revision "$backend_revision" \
            --output json > "$backend_revision_json"
          chmod 0600 "$backend_app_json" "$backend_revision_json"
          CONTAINER_APP_KIND=backend \
            EXPECTED_DATA_STORE="$PRODUCTION_DATA_STORE" \
            EXPECTED_STORAGE_ACCOUNT="$AZURE_STORAGE_ACCOUNT_NAME" \
            EXPECTED_STORAGE_CONTAINER="$AZURE_STORAGE_CONTAINER_NAME" \
            EXPECTED_CURRENT_BLOB="$AZURE_STORAGE_CURRENT_BLOB" \
            EXPECTED_BACKEND_CLIENT_ID="$BACKEND_IDENTITY_CLIENT_ID" \
            EXPECTED_APP_NAME="$AZURE_CONTAINER_APP_BACKEND" \
            EXPECTED_REVISION="$backend_revision" \
            EXPECTED_IMAGE="$BACKEND_IMAGE" \
            EXPECTED_REGISTRY="$REGISTRY" \
            EXPECTED_IDENTITY_ID="$BACKEND_IDENTITY_ID" \
            scripts/production/verify-container-app-state.py \
              "$backend_app_json" "$backend_revision_json"

          {
            echo "BACKEND_URL=https://$backend_fqdn"
            echo "BACKEND_FQDN=$backend_fqdn"
            echo "BACKEND_REVISION=$backend_revision"
          } >> "$GITHUB_ENV"

      - name: Verify internal Backend health and official indicator APIs
        shell: bash
        run: |
          set -euo pipefail
          job="kokusei-prod-smoke"
          validation_code="$(cat <<'JAVASCRIPT'
          const base = process.env.TARGET_URL;
          const required = ["population", "births", "unemployment-rate"];
          const request = async (path) => {
            let lastError;
            for (let attempt = 0; attempt < 12; attempt += 1) {
              try {
                const response = await fetch(`${base}${path}`);
                if (!response.ok) throw new Error(`status ${response.status}`);
                return response;
              } catch (error) {
                lastError = error;
                await new Promise((resolve) => setTimeout(resolve, 5000));
              }
            }
            throw lastError;
          };
          (async () => {
            await request("/health");
            const payload = await (await request("/api/indicators")).json();
            if (!Array.isArray(payload.data) || payload.data.length === 0) {
              throw new Error("Indicator API payload is empty");
            }
            for (const slug of required) {
              const indicator = payload.data.find((item) => item.slug === slug);
              if (!indicator || indicator.latest?.value == null || indicator.latest.value === "") {
                throw new Error(`Required indicator value is missing: ${slug}`);
              }
              const detail = await (await request(`/api/indicators/${slug}`)).json();
              if (detail.data?.latest?.value == null || detail.data.latest.value === "") {
                throw new Error(`Required indicator detail value is missing: ${slug}`);
              }
            }
            console.log("Backend health, indicator list, and official indicator values are valid");
          })().catch((error) => {
            console.error(error.message);
            process.exit(1);
          });
          JAVASCRIPT
          )"
          if ! az containerapp job show -g "$AZURE_RESOURCE_GROUP" -n "$job" --output none 2>/dev/null; then
            az containerapp job create -g "$AZURE_RESOURCE_GROUP" -n "$job" \
              --environment "$AZURE_CONTAINER_APP_ENVIRONMENT" --trigger-type Manual \
              --replica-completion-count 1 --parallelism 1 --replica-retry-limit 0 --replica-timeout 600 \
              --image "$FRONTEND_IMAGE" --command node \
              --args="--eval=$validation_code" \
              --mi-user-assigned "$BACKEND_IDENTITY_ID" --registry-server "$REGISTRY" --registry-identity "$BACKEND_IDENTITY_ID" \
              --env-vars TARGET_URL="$BACKEND_URL" --cpu 0.25 --memory 0.5Gi --only-show-errors --output none
          else
            az containerapp job update -g "$AZURE_RESOURCE_GROUP" -n "$job" \
              --image "$FRONTEND_IMAGE" --command node \
              --args="--eval=$validation_code" \
              --replace-env-vars TARGET_URL="$BACKEND_URL" --output none
          fi
          execution="$(az containerapp job start -g "$AZURE_RESOURCE_GROUP" -n "$job" --query name -o tsv)"
          for attempt in {1..60}; do
            status="$(az containerapp job execution show -g "$AZURE_RESOURCE_GROUP" -n "$job" --job-execution-name "$execution" --query properties.status -o tsv)"
            case "$status" in Succeeded) break ;; Failed) echo "Backend health/API validation failed"; exit 1 ;; esac
            [ "$attempt" -lt 60 ] || { echo "Backend health/API validation timed out"; exit 1; }
            sleep 10
          done

      - name: Create or update Frontend after Backend validation
        shell: bash
        run: |
          set -euo pipefail
          temporary_directory="$(mktemp -d "$RUNNER_TEMP/kokusei-stage3-frontend.XXXXXX")"
          cleanup() {
            rm -rf "$temporary_directory"
          }
          trap cleanup EXIT HUP INT TERM

          environment_id="$(az containerapp env show -g "$AZURE_RESOURCE_GROUP" -n "$AZURE_CONTAINER_APP_ENVIRONMENT" --query id -o tsv)"
          site_url="$PUBLIC_SITE_URL"
          custom_domains='[]'
          frontend_exists=false
          if frontend_json="$(az containerapp show -g "$AZURE_RESOURCE_GROUP" -n "$AZURE_CONTAINER_APP_FRONTEND" --output json 2>/dev/null)"; then
            frontend_exists=true
            actual_fqdn="$(jq -er '.properties.configuration.ingress.fqdn' <<<"$frontend_json")"
            [ "$actual_fqdn" = "$FRONTEND_PLATFORM_FQDN" ] || {
              echo "Frontend platform FQDN changed after pre-deployment validation"
              exit 1
            }
            custom_domains="$(jq -c '.properties.configuration.ingress.customDomains // []' <<<"$frontend_json")"
            if [ "$PUBLIC_SITE_HOST" != "$FRONTEND_PLATFORM_FQDN" ]; then
              jq -e --arg host "$PUBLIC_SITE_HOST" '
                [
                  .[]
                  | select(
                      .name == $host
                      and .bindingType == "SniEnabled"
                      and (.certificateId | type == "string" and length > 0)
                    )
                ] | length == 1
              ' <<<"$custom_domains" >/dev/null || {
                echo "Frontend public custom domain binding changed before deployment"
                exit 1
              }
            fi
          elif [ "$PUBLIC_SITE_HOST" != "$FRONTEND_PLATFORM_FQDN" ]; then
            echo "Frontend custom domain binding is required before deployment"
            exit 1
          fi
          specification="$temporary_directory/frontend-container-app.json"
          internal_specification="$temporary_directory/frontend-container-app-internal.json"
          jq -n \
            --arg environment_id "$environment_id" \
            --arg identity_id "$FRONTEND_IDENTITY_ID" \
            --arg registry "$REGISTRY" \
            --arg image "$FRONTEND_IMAGE" \
            --arg revision "$REVISION_SUFFIX" \
            --arg backend_url "$BACKEND_URL" \
            --arg site_url "$site_url" \
            --argjson custom_domains "$custom_domains" \
            '{
              identity: {type: "UserAssigned", userAssignedIdentities: {($identity_id): {}}},
              properties: {
                environmentId: $environment_id,
                configuration: {
                  activeRevisionsMode: "Multiple",
                  ingress: {
                    external: true,
                    targetPort: 3000,
                    transport: "auto",
                    allowInsecure: false,
                    customDomains: $custom_domains
                  },
                  registries: [{server: $registry, identity: $identity_id}]
                },
                template: {
                  revisionSuffix: $revision,
                  containers: [{
                    name: "frontend",
                    image: $image,
                    resources: {cpu: 0.25, memory: "0.5Gi"},
                    env: [
                      {name: "INTERNAL_API_URL", value: $backend_url},
                      {name: "NEXT_PUBLIC_SITE_URL", value: $site_url}
                    ],
                    probes: [
                      {type: "Startup", httpGet: {path: "/health", port: 3000}, initialDelaySeconds: 5, periodSeconds: 5, failureThreshold: 10},
                      {type: "Liveness", httpGet: {path: "/health", port: 3000}, initialDelaySeconds: 10, periodSeconds: 10, failureThreshold: 3},
                      {type: "Readiness", httpGet: {path: "/health", port: 3000}, initialDelaySeconds: 5, periodSeconds: 5, failureThreshold: 3}
                    ]
                  }],
                  scale: {minReplicas: 0, maxReplicas: 2}
                }
              }
            }' > "$specification"

          if [ "$frontend_exists" = "true" ]; then
            az containerapp update -g "$AZURE_RESOURCE_GROUP" -n "$AZURE_CONTAINER_APP_FRONTEND" \
              --yaml "$specification" --only-show-errors --output none
          else
            jq '.properties.configuration.ingress.external = false' "$specification" > "$internal_specification"
            az containerapp create -g "$AZURE_RESOURCE_GROUP" -n "$AZURE_CONTAINER_APP_FRONTEND" \
              --environment "$AZURE_CONTAINER_APP_ENVIRONMENT" \
              --yaml "$internal_specification" --only-show-errors --output none
            az containerapp update -g "$AZURE_RESOURCE_GROUP" -n "$AZURE_CONTAINER_APP_FRONTEND" \
              --yaml "$specification" --only-show-errors --output none
          fi

          frontend_fqdn="$(az containerapp show -g "$AZURE_RESOURCE_GROUP" -n "$AZURE_CONTAINER_APP_FRONTEND" --query properties.configuration.ingress.fqdn -o tsv)"
          [ "$frontend_fqdn" = "$FRONTEND_PLATFORM_FQDN" ] || { echo "Frontend platform FQDN read-back does not match"; exit 1; }
          frontend_revision="$(az containerapp show -g "$AZURE_RESOURCE_GROUP" -n "$AZURE_CONTAINER_APP_FRONTEND" --query properties.latestRevisionName -o tsv)"
          [ -n "$frontend_revision" ] || { echo "Frontend active revision is missing"; exit 1; }
          az containerapp ingress traffic set \
            -g "$AZURE_RESOURCE_GROUP" \
            -n "$AZURE_CONTAINER_APP_FRONTEND" \
            --revision-weight "$frontend_revision=100" \
            --only-show-errors --output none

          frontend_app_json="$temporary_directory/frontend-app.json"
          frontend_revision_json="$temporary_directory/frontend-revision.json"
          az containerapp show \
            -g "$AZURE_RESOURCE_GROUP" \
            -n "$AZURE_CONTAINER_APP_FRONTEND" \
            --output json > "$frontend_app_json"
          az containerapp revision show \
            -g "$AZURE_RESOURCE_GROUP" \
            -n "$AZURE_CONTAINER_APP_FRONTEND" \
            --revision "$frontend_revision" \
            --output json > "$frontend_revision_json"
          chmod 0600 "$frontend_app_json" "$frontend_revision_json"
          CONTAINER_APP_KIND=frontend \
            EXPECTED_APP_NAME="$AZURE_CONTAINER_APP_FRONTEND" \
            EXPECTED_REVISION="$frontend_revision" \
            EXPECTED_IMAGE="$FRONTEND_IMAGE" \
            EXPECTED_REGISTRY="$REGISTRY" \
            EXPECTED_IDENTITY_ID="$FRONTEND_IDENTITY_ID" \
            EXPECTED_PUBLIC_HOST="$PUBLIC_SITE_HOST" \
            scripts/production/verify-container-app-state.py \
              "$frontend_app_json" "$frontend_revision_json"

          jq -e \
            --arg backend_url "$BACKEND_URL" \
            --arg site_url "$site_url" \
            '
              [
                .properties.template.containers[]
                | select(.name == "frontend")
                | .env[]
                | select(.name == "INTERNAL_API_URL" and .value == $backend_url)
              ] | length == 1
            ' "$frontend_revision_json" >/dev/null || {
              echo "Frontend INTERNAL_API_URL read-back does not match"
              exit 1
            }
          jq -e \
            --arg site_url "$site_url" \
            '
              [
                .properties.template.containers[]
                | select(.name == "frontend")
                | .env[]
                | select(
                    .name == "NEXT_PUBLIC_SITE_URL"
                    and (.value | sub("/+$"; "")) == $site_url
                    and (.value | startswith("https://"))
                    and (.value | test("localhost|127[.]0[.]0[.]1"; "i") | not)
                  )
              ] | length == 1
            ' "$frontend_revision_json" >/dev/null || {
              echo "Frontend NEXT_PUBLIC_SITE_URL read-back does not match the production HTTPS URL"
              exit 1
            }

          {
            echo "FRONTEND_URL=$site_url"
            echo "FRONTEND_PLATFORM_URL=https://$frontend_fqdn"
            echo "FRONTEND_REVISION=$frontend_revision"
          } >> "$GITHUB_ENV"

      - name: Verify Frontend health
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            --retry 12 --retry-all-errors --retry-delay 5 \
            --output /dev/null "$FRONTEND_URL/health"

      - name: Run public smoke tests
        shell: bash
        run: |
          set -euo pipefail
          site="$PUBLIC_SITE_URL"
          normalize_public_url() {
            local value="$1"
            [ -n "$value" ] || return 1
            printf '%s' "${value%/}"
          }
          assert_public_url() {
            local label="$1"
            local actual="$2"
            local expected_normalized
            local actual_normalized
            expected_normalized="$(normalize_public_url "$site")"
            if ! actual_normalized="$(normalize_public_url "$actual")"; then
              echo "$label URL is missing"
              exit 1
            fi
            if [ "$actual_normalized" != "$expected_normalized" ]; then
              echo "$label URL does not match: expected=$expected_normalized actual=$actual_normalized"
              exit 1
            fi
          }
          for path in / /indicators/population /indicators/births /indicators/unemployment-rate /updates /robots.txt /sitemap.xml /og-image.png; do
            curl --fail --silent --show-error --location --retry 12 --retry-all-errors --retry-delay 5 --output /dev/null "$site$path"
          done
          html="$(curl --fail --silent --show-error --location "$site/")"
          for slug in population births unemployment-rate; do
            printf '%s' "$html" | grep -F "/indicators/$slug" >/dev/null
          done
          if printf '%s' "$html" | grep -F "現在、表示できる指標が登録されていません。" >/dev/null; then
            echo "Public dashboard reported an empty indicator list"
            exit 1
          fi
          canonical_url=
          if [[ "$html" =~ \<link\ rel=\"canonical\"\ href=\"([^\"]*)\" ]]; then
            canonical_url="${BASH_REMATCH[1]}"
          fi
          og_url=
          if [[ "$html" =~ property=\"og:url\"\ content=\"([^\"]*)\" ]]; then
            og_url="${BASH_REMATCH[1]}"
          fi
          assert_public_url "canonical" "$canonical_url"
          assert_public_url "og:url" "$og_url"
          printf '%s' "$html" | grep -F "property=\"og:image\" content=\"$site/og-image.png\""
          printf '%s' "$html" | grep -F "name=\"twitter:image\" content=\"$site/og-image.png\""
          sitemap="$(curl --fail --silent --show-error "$site/sitemap.xml")"
          robots="$(curl --fail --silent --show-error "$site/robots.txt")"
          printf '%s' "$sitemap" | grep -F "$site/"
          printf '%s' "$robots" | grep -F "$site/sitemap.xml"
          if printf '%s\n%s\n%s' "$html" "$sitemap" "$robots" | grep -E '(localhost|127[.]0[.]0[.]1)' >/dev/null; then
            echo "Public SEO metadata must not reference localhost"
            exit 1
          fi

      - name: Write Stage 3 deployment summary
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## Production Stage 3 completed"
            echo
            echo "- Stage 2 run ID: \`$STAGE2_RUN_ID\`"
            echo "- Commit SHA: \`$TARGET_COMMIT\`"
            echo "- Frontend URL: $FRONTEND_URL"
            echo "- Frontend platform URL: $FRONTEND_PLATFORM_URL"
            echo "- Frontend revision: \`$FRONTEND_REVISION\`"
            echo "- Frontend digest: \`$FRONTEND_DIGEST\`"
            echo "- Frontend ingress/traffic read-back: external, target revision 100%"
            echo "- Backend internal FQDN: \`$BACKEND_FQDN\`"
            echo "- Backend revision: \`$BACKEND_REVISION\`"
            echo "- Backend digest: \`$BACKEND_DIGEST\`"
            echo "- Backend ingress/traffic read-back: internal, target revision 100%"
            echo "- Backend health/API validation: succeeded"
            echo "- Frontend health: succeeded"
            echo "- Public smoke tests: succeeded"
          } >> "$GITHUB_STEP_SUMMARY"

      # Initial publication has no known-good revision. Never delete or roll back
      # automatically; preserve and report the exact state for human review.
      - name: Report remaining production state without mutation
        if: ${{ always() }}
        env:
          PRIOR_JOB_STATUS: ${{ job.status }}
        shell: bash
        run: |
          set -u
          {
            echo
            echo "## Stage 3 final state"
            echo
            echo "- Job status before this report: \`$PRIOR_JOB_STATUS\`"
            echo "- Automatic workflow rerun: disabled"
            echo "- Automatic deletion: disabled"
            echo "- Automatic rollback: disabled"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "${AZURE_AUTHENTICATED:-}" != "true" ]; then
            {
              echo "- Azure login was not completed; Container Apps mutation steps could not start."
              echo "- Human action: correct the pre-deployment failure and perform a new review."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          report_app() {
            app_name=$1
            label=$2
            if app_json="$(az containerapp show -g "$AZURE_RESOURCE_GROUP" -n "$app_name" --output json 2>/dev/null)"; then
              external="$(jq -r '.properties.configuration.ingress.external // false' <<<"$app_json")"
              fqdn="$(jq -r '.properties.configuration.ingress.fqdn // "none"' <<<"$app_json")"
              revision="$(jq -r '.properties.latestRevisionName // "none"' <<<"$app_json")"
              traffic="$(jq -c '[.properties.configuration.ingress.traffic[]? | {revisionName,weight}]' <<<"$app_json")"
              {
                echo "- $label app: exists"
                echo "- $label external ingress: \`$external\`"
                echo "- $label FQDN: \`$fqdn\`"
                echo "- $label latest revision: \`$revision\`"
                echo "- $label traffic: \`$traffic\`"
              } >> "$GITHUB_STEP_SUMMARY"
            else
              echo "- $label app: not created" >> "$GITHUB_STEP_SUMMARY"
            fi
          }

          report_app "$AZURE_CONTAINER_APP_BACKEND" "Backend"
          report_app "$AZURE_CONTAINER_APP_FRONTEND" "Frontend"
          if az containerapp job show -g "$AZURE_RESOURCE_GROUP" -n kokusei-prod-smoke --output none 2>/dev/null; then
            echo "- Smoke job: exists" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- Smoke job: not created" >> "$GITHUB_STEP_SUMMARY"
          fi
          {
            echo "- If Frontend external ingress is true, its Azure HTTPS URL may already be publicly reachable."
            echo "- Human action: inspect the reported resources, ingress, revision, and traffic before deciding whether to fix, rerun, or remove them."
          } >> "$GITHUB_STEP_SUMMARY"
